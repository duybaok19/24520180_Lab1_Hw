<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
</head>
<body>

    <h1>Drum Kit</h1>

    <div class="drum-kit">
        <button class="drum-pad" data-key="q" data-sound="sounds/clap.wav">Q</button>
        <button class="drum-pad" data-key="w" data-sound="sounds/kick.wav">W</button>
        <button class="drum-pad" data-key="e" data-sound="sounds/hihat.wav">E</button>
        <button class="drum-pad" data-key="a" data-sound="sounds/snare.wav">A</button>
        <button class="drum-pad" data-key="s" data-sound="sounds/tom.wav">S</button>
        <button class="drum-pad" data-key="d" data-sound="sounds/crash.wav">D</button>
    </div>

</body>
</html>
